services:

  proxy:
    image: traefik:v3.7
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      # Enable Traefik for this service
      - traefik.enable=true
      # Route HTTP traffic for the Adminer subdomain
      - traefik.http.routers.adminer-http.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.adminer-http.entrypoints=http
      # Define the port inside of the Docker service to use
      - traefik.http.services.adminer.loadbalancer.server.port=8080

  # S3-compatible object storage for uploaded files. SeaweedFS (Apache-2.0) because
  # MinIO's community repository is archived (see docs/DECISIONS.md D14). The backend
  # only speaks the S3 API, so this can be swapped for any S3 server.
  storage:
    image: chrislusf/seaweedfs:4.54
    command:
      - mini
      - -dir=/data
      - -bucket=${S3_BUCKET:-product}
    environment:
      # Admin credentials of the S3 API (the same values the backend uses).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Variable not set}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Variable not set}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      # /data also holds the filer metadata (see /etc/seaweedfs/filer.toml in the image)
      - app-storage-data:/data

  # One-shot: makes sure the bucket exists and lets the browser PUT/GET from FRONTEND_HOST.
  storage-init:
    image: amazon/aws-cli:2.42.1
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Variable not set}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Variable not set}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:-product}
      # Origin allowed to PUT/GET in the browser. STORAGE_CORS_ORIGIN overrides it when the
      # app is opened from somewhere else (CI Playwright opens it at http://backend:8000).
      FRONTEND_HOST: ${STORAGE_CORS_ORIGIN:-${FRONTEND_HOST:-http://localhost:5173}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ep=http://storage:8333
        aws --endpoint-url $$ep s3api head-bucket --bucket $$BUCKET 2>/dev/null || aws --endpoint-url $$ep s3api create-bucket --bucket $$BUCKET
        aws --endpoint-url $$ep s3api put-bucket-cors --bucket $$BUCKET --cors-configuration "{\"CORSRules\":[{\"AllowedOrigins\":[\"$$FRONTEND_HOST\"],\"AllowedMethods\":[\"PUT\",\"GET\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}"
        echo "bucket $$BUCKET ready, CORS allows $$FRONTEND_HOST"

  backend:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
      storage-init:
        condition: service_completed_successfully
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Optional modules (e.g. items,content). Empty -> the app default (items).
      MODULES: ${MODULES:-}
      # Backend -> bucket uses the internal hostname; presigned URLs use the public
      # one, because the browser must be able to reach the host in the URL.
      S3_ENDPOINT_URL: http://storage:8333
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Variable not set}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Variable not set}
      S3_BUCKET: ${S3_BUCKET:-product}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-}
      STORAGE_TOTAL_LIMIT_BYTES: ${STORAGE_TOTAL_LIMIT_BYTES:-}
      STORAGE_USER_QUOTA_BYTES: ${STORAGE_USER_QUOTA_BYTES:-}
      UPLOADS_PER_USER_PER_DAY: ${UPLOADS_PER_USER_PER_DAY:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # Route HTTP traffic for this domain
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.backend-http.entrypoints=http

volumes:
  app-db-data:
  app-storage-data:
